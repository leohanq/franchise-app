server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: franchise-app
  datasource:
    url: jdbc:mysql://localhost:3306/franchise
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
